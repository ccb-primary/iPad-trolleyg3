<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primary CCB: Grade 3 iPad Trolley Booking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .bg-brand-green { background-color: #059669; }
        .bg-brand-green-dark { background-color: #047857; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-brand-green text-white shadow-md">
        <div class="w-full px-6 py-3 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-tight">Primary CCB: Grade 3 iPad Trolley Booking System</h1>
                <p class="text-xs text-emerald-100">Grade 3 iPad Reservation Matrix & Synchronization</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="firebaseStatusBtn" onclick="openFirebaseModal()" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-white/10 text-emerald-100 border border-white/20 flex items-center gap-2 hover:bg-white/20 transition">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="firebaseStatusText">Demo Mode (Local)</span>
                </button>
                <div id="authContainer" class="flex items-center gap-2">
                    <!-- Auth UI rendered via JS -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full px-4 py-4 flex-1 flex flex-col">
        <!-- Controls Bar -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 mb-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <button onclick="changeWeek(-1)" class="px-3 py-1.5 text-xs font-medium border border-slate-300 rounded-lg hover:bg-slate-50 transition">&lt; Prev Week</button>
                <button onclick="resetToCurrentWeek()" class="px-3 py-1.5 text-xs font-medium text-emerald-700 bg-emerald-50 rounded-lg hover:bg-emerald-100 transition">Current Week</button>
                <button onclick="changeWeek(1)" class="px-3 py-1.5 text-xs font-medium border border-slate-300 rounded-lg hover:bg-slate-50 transition">Next Week &gt;</button>
                <span id="weekDisplayBadge" class="ml-2 px-3 py-1.5 text-xs font-bold text-slate-700 bg-slate-100 rounded-lg border border-slate-200"></span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.print()" class="px-3 py-1.5 text-xs font-medium text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 transition">
                    <i class="fa-solid fa-print mr-1"></i> Door Display / Print
                </button>
            </div>
        </div>

        <!-- Timetable Grid -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
            <div class="overflow-x-auto h-full flex-1">
                <table class="w-full text-left border-collapse min-w-[1100px] h-full">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600">
                            <th class="p-3 w-36 border-r border-slate-200">Day</th>
                            <th class="p-3 border-r border-slate-200 w-[10%]">Period 1<br><span class="text-[10px] text-slate-400 font-normal">08:15-09:00</span></th>
                            <th class="p-3 border-r border-slate-200 w-[10%]">Period 2<br><span class="text-[10px] text-slate-400 font-normal">09:00-09:45</span></th>
                            <th class="p-3 border-r border-slate-200 w-[10%]">Period 3<br><span class="text-[10px] text-slate-400 font-normal">10:
